# Plane Point Counting Strategy — configuration

# Path to pre-filtered plane point cloud
plane_map_path: "/home/loc/loc_ws/data/dianwanghesai/plane_map.ply"

# Dual-loop timing
strategy_period: 2.0            # strategy re-evaluation period (s)
rotation_period: 1.0            # step interval for gimbal motion (s)

# ERP count-grid parameters
erp_resolution_deg: 1.0        # degrees per pixel

# Local point extraction
range_max_m: 75.0             # kd-tree radius around LiDAR (m)

# Rectangle search (sensor FoV + hard pitch limits)
fov_horizontal_deg: 60.0
fov_vertical_deg: 68.0
pitch_min_deg: -15.0
pitch_max_deg: 15.0

# LiDAR extrinsic: [tx, ty, tz, roll, pitch, yaw] (m, m, m, deg, deg, deg)
# lidar_extinct: [-0.2, 0.25, 1.43, 0, 0, 0]
lidar_extinct: [1.08, 0, 1.643, 1.67, 0.49, 89.24]

# Angular velocity limits
pan_angular_velocity_deg: 20.0   # deg/s
tilt_angular_velocity_deg: 8.0   # deg/s
