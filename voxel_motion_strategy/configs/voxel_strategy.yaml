# Voxel Motion Strategy — configuration

# Path to pre-built octomap (prefix for .ot + .normals files)
octomap_prefix: "/home/loc/loc_ws/data/dianwanghesai/octomap"

# Dual-loop timing
strategy_period: 2.0            # strategy re-evaluation period (s)
rotation_period: 1.0            # step interval for gimbal motion (s)

# ERP projection
erp_resolution_deg: 1.0       # degrees per pixel
erp_range_max_m: 150.0        # max ray distance
erp_self_range_m: 15.0         # voxels closer than this → n = (0,0,0)
erp_vfov_min_deg: -50.0       # vertical FoV min (elevation)
erp_vfov_max_deg: 50.0        # vertical FoV max

# Rectangle search
fov_horizontal_deg: 60.0      # Avia circular FoV inscribed rectangle (horizontal)
fov_vertical_deg: 68.0        # Avia circular FoV inscribed rectangle (vertical)
pitch_min_deg: -15.0          # candidate pitch range (hard limit)
pitch_max_deg: 15.0
weight_pitch: 0.0             # pitch penalty (0 = disabled)

# LiDAR extrinsic: [tx, ty, tz, roll, pitch, yaw]  (m, m, m, deg, deg, deg)
# Same format as iekf3d/configs/configs.yaml — copy from there.
lidar_extinct: [1.08, 0.0, 1.643, 1.67, 0.49, 89.24]

# Angular velocity limits
# Strategy feasible range = ±vel × strategy_period
# Step size per rotation tick = vel × rotation_period
pan_angular_velocity_deg: 20.0         # deg/s  (max pan speed)
tilt_angular_velocity_deg: 8.0        # deg/s  (max tilt speed)
